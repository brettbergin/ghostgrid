<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ghostgrid's icon, drawn like Scripts/make-icon.swift: a dark tile with a
       2x2 grid of panes, the top-left one focused (Catppuccin Mocha blue). -->
  <defs>
    <radialGradient id="glow" cx="350" cy="350" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#89B4FA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0A0A0A" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- focused pane -->
    <rect x="188" y="188" width="307" height="307" rx="34" fill="#141414" stroke="#89B4FA" stroke-width="14"/>
    <polyline points="226,240 248,258 226,276" fill="none" stroke="#B4BEFE" stroke-width="9"/>
    <rect x="270" y="251" width="150" height="14" rx="7" fill="#CDD6F4" fill-opacity="0.85"/>
    <rect x="226" y="343" width="210" height="14" rx="7" fill="#CDD6F4" fill-opacity="0.85"/>
    <rect x="226" y="389" width="120" height="14" rx="7" fill="#CDD6F4" fill-opacity="0.85"/>
    <rect x="436" y="424" width="18" height="34" fill="#89B4FA"/>
    <!-- other panes -->
    <g fill="#141414" stroke="#45475A" stroke-width="7">
      <rect x="529" y="188" width="307" height="307" rx="34"/>
      <rect x="188" y="529" width="307" height="307" rx="34"/>
      <rect x="529" y="529" width="307" height="307" rx="34"/>
    </g>
    <g fill="none" stroke="#45475A" stroke-width="9">
      <polyline points="567,240 589,258 567,276"/>
      <polyline points="226,581 248,599 226,617"/>
      <polyline points="567,581 589,599 567,617"/>
    </g>
    <g fill="#45475A">
      <rect x="611" y="251" width="120" height="14" rx="7"/><rect x="567" y="297" width="180" height="14" rx="7"/><rect x="567" y="343" width="90" height="14" rx="7"/>
      <rect x="270" y="592" width="120" height="14" rx="7"/><rect x="226" y="638" width="180" height="14" rx="7"/><rect x="226" y="684" width="90" height="14" rx="7"/>
      <rect x="611" y="592" width="120" height="14" rx="7"/><rect x="567" y="638" width="180" height="14" rx="7"/><rect x="567" y="684" width="90" height="14" rx="7"/>
    </g>
  </g>
</svg>
