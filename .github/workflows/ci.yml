# Runs `make check` (tests, the app bundle, shellcheck) on GitHub's macOS
# runners for every pull request and every push to main.
#
# Pull requests from forks run here with a read-only token and no secrets:
# the workflow uses `pull_request` (never `pull_request_target`), signs
# nothing and publishes nothing. First-time contributors wait for approval
# (the repository's Actions setting).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: make check
        run: make check
